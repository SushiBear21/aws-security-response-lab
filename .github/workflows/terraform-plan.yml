name: Reviewed Terraform plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: p3-terraform-state
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tested dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build Lambda packages
        run: python scripts/package_lambdas.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Show selected OIDC identity claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const claims = JSON.parse(
              Buffer.from(token.split(".")[1], "base64url").toString("utf8")
            );

            core.info(JSON.stringify({
              issuer: claims.iss,
              audience: claims.aud,
              subject: claims.sub,
              repository: claims.repository,
              ref: claims.ref,
              workflow: claims.workflow
            }, null, 2));
      - name: Obtain temporary planning credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::359769212511:role/p3-github-plan
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: p3-plan-${{ github.run_id }}
          allowed-account-ids: "359769212511"

      - name: Initialize the existing remote backend
        run: >
          terraform -chdir=infra/terraform init
          -input=false
          -lockfile=readonly
          -backend-config=backend.hcl

      - name: Validate
        run: terraform -chdir=infra/terraform validate

      - name: Plan without applying
        run: >
          terraform -chdir=infra/terraform plan
          -input=false
          -lock-timeout=60s
          -no-color