name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DEFAULT_REGION: us-east-1
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tested dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Check Python syntax
        run: python -m compileall -q app tests scripts

      - name: Run offline tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build and inspect Lambda packages
        run: python scripts/package_lambdas.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Initialize without accessing state
        run: terraform -chdir=infra/terraform init -backend=false -lockfile=readonly

      - name: Validate Terraform
        run: terraform -chdir=infra/terraform validate