name: AWS identity check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  identity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::359769212511:role/p3-github-plan
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: p3-identity-${{ github.run_id }}
          allowed-account-ids: "359769212511"

      - name: Verify AWS account and role
        shell: bash
        run: |
          set -euo pipefail

          account=$(aws sts get-caller-identity --query Account --output text)
          arn=$(aws sts get-caller-identity --query Arn --output text)

          test "$account" = "359769212511"

          case "$arn" in
            arn:aws:sts::359769212511:assumed-role/p3-github-plan/*)
              ;;
            *)
              echo "Unexpected AWS role."
              exit 1
              ;;
          esac

          echo "Verified account: $account"
          echo "Verified role: $arn"